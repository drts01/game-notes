<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e" />
    </marker>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title / Start -->
  <g filter="url(#shadow)">
    <rect x="350" y="20" width="200" height="45" rx="8" fill="#1f6beb" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="450" y="48" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">Game Start</text>
  </g>

  <!-- Flow Line Start to Group -->
  <path d="M 450 65 L 450 90" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Subgraph Box: Chapter Sequence -->
  <rect x="50" y="90" width="800" height="230" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="70" y="115" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="1">CHAPTER SEQUENCE (BEGIN CHAPTER 1-5)</text>

  <!-- Node C: Setup -->
  <g filter="url(#shadow)">
    <rect x="80" y="150" width="180" height="60" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
    <text x="170" y="176" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Chapter Setup:</text>
    <text x="170" y="194" fill="#e9d5ff" font-size="12" text-anchor="middle">Deal 6 Action Cards</text>
  </g>

  <path d="M 260 180 L 290 180" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node D: Initiative Lead -->
  <g filter="url(#shadow)">
    <rect x="300" y="150" width="180" height="60" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="390" y="176" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Initiative Player</text>
    <text x="390" y="194" fill="#bbf7d0" font-size="12" text-anchor="middle">Leads Action Card</text>
  </g>

  <path d="M 480 180 L 510 180" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node E: Subsequent Players -->
  <g filter="url(#shadow)">
    <rect x="520" y="150" width="170" height="60" rx="8" fill="#713f12" stroke="#eab308" stroke-width="1.5"/>
    <text x="605" y="176" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Subsequent Players</text>
    <text x="605" y="194" fill="#fef08a" font-size="12" text-anchor="middle">Play Action Card</text>
  </g>

  <path d="M 690 180 L 720 180" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node F: Decision Diamond -->
  <g filter="url(#shadow)">
    <polygon points="770,135 830,180 770,225 710,180" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="770" y="176" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Action Cards</text>
    <text x="770" y="190" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Exhausted?</text>
  </g>

  <!-- Loop Back Link (No) -->
  <path d="M 770 135 L 770 120 L 390 120 L 390 140" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="560" y="110" width="30" height="18" rx="4" fill="#161b22"/>
  <text x="575" y="123" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">NO</text>

  <!-- Flow Exit Chapter Box (Yes) -->
  <path d="M 770 225 L 770 350 L 560 350" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="775" y="240" width="32" height="18" rx="4" fill="#161b22"/>
  <text x="791" y="253" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">YES</text>

  <!-- Node G: End Chapter -->
  <g filter="url(#shadow)">
    <rect x="340" y="320" width="210" height="60" rx="8" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
    <text x="445" y="346" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">End Chapter</text>
    <text x="445" y="364" fill="#ffedd5" font-size="12" text-anchor="middle">Score Declared Ambitions</text>
  </g>

  <path d="M 445 380 L 445 410" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node I: Game End Decision -->
  <g filter="url(#shadow)">
    <polygon points="445,410 575,455 445,500 315,455" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="445" y="450" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Chapter 5 OR</text>
    <text x="445" y="465" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Power Threshold Met?</text>
  </g>

  <!-- Flow to Victory (Yes) -->
  <path d="M 445 500 L 445 570" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="452" y="520" width="32" height="18" rx="4" fill="#161b22"/>
  <text x="468" y="533" fill="#4ade80" font-size="11" font-weight="700" text-anchor="middle">YES</text>

  <!-- Node K: Victory Resolution -->
  <g filter="url(#shadow)">
    <rect x="340" y="580" width="210" height="50" rx="8" fill="#854d0e" stroke="#facc15" stroke-width="1.5"/>
    <text x="445" y="610" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">★ Victory Resolution</text>
  </g>

  <!-- Flow to Cleanup (No) -->
  <path d="M 315 455 L 250 455" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="270" y="437" width="30" height="18" rx="4" fill="#161b22"/>
  <text x="285" y="450" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">NO</text>

  <!-- Node J: Clean Up -->
  <g filter="url(#shadow)">
    <rect x="30" y="415" width="210" height="80" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="45" y="440" fill="#bfdbfe" font-size="12">1. Clean Up</text>
    <text x="45" y="460" fill="#bfdbfe" font-size="12">2. Increment Ambition Points</text>
    <text x="45" y="480" fill="#bfdbfe" font-size="12">3. Advance Chapter Marker</text>
  </g>

  <!-- Upward Loop-Back Arrow into Bottom of Node C (Chapter Setup) -->
  <path d="M 170 415 L 170 212" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
